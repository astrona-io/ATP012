apiVersion: content.astrona.io/v1alpha1
kind: TrainingPath
metadata:
  id: ATP012
  slug: certified-argo-project-associate-capa
  title: Certified Argo Project Associate (CAPA)
  description: >-
    The Certified Argo Project Associate track: one course per exam domain —
    Argo Workflows, Argo CD, Argo Rollouts and Argo Events — with layered
    readings, private playgrounds, graded labs and knowledge checks that run on
    your own computer with the Astrona CLI.
  version: 1.0.0
  language: en
  authors:
  - name: Paris Nakita Kejser
    email: paris@astrona.io
    company: Astrona.io
  tags:
  - CAPA
  - Certification Preparation
  license: Apache-2.0
spec:
  audience: Learners preparing for Certified Argo Project Associate (CAPA).
  difficulty: Beginner
  examPreparation:
    enabled: true
    title: Certified Argo Project Associate (CAPA)
    officialSyllabusUrl: https://training.linuxfoundation.org/certification/certified-argo-project-associate-capa/
    examId: CAPA
    provider: CNCF / The Linux Foundation
  prerequisites:
  - Basic command-line knowledge and familiarity with the subject of the exam.
  - A computer capable of running the environments selected during content authoring.
  learningOutcomes:
  - Write, template and run Argo Workflows with artifacts, DAGs and data processing steps.
  - Declare, synchronize and troubleshoot Argo CD Applications with Helm and Kustomize sources.
  - Run canary and blue-green releases with Argo Rollouts, including analysis templates and runs.
  - Build event-driven automation with Argo Events sources, sensors, triggers and the EventBus.
  stages:
  - id: ATP012-STG001
    title: Argo Workflows
    description: Workflow resources and templates, the workflow spec, artifacts, DAGs and data processing jobs with Argo Workflows v3.7.
    examDomain: Argo Workflows
    weight: 36
    learningOutcomes:
    - Understand Argo Workflow Fundamentals
    - Generating and Consuming Artifacts
    - Understand Argo Workflow Templates
    - Understand the Argo Workflow Spec
    - Work with DAG (Directed-Acyclic Graphs)
    - Run Data Processing Jobs with Argo Workflows
    content:
    - ref: ATS060
      repository: https://github.com/astrona-io/ATS060
      path: .
      version: 1.0.0
  - id: ATP012-STG002
    title: ARGO CD
    description: Argo CD fundamentals, Application synchronization, sync policies and hooks, Helm and Kustomize sources, and common reconciliation patterns with Argo CD v3.5.
    examDomain: ARGO CD
    weight: 34
    learningOutcomes:
    - Understand Argo CD Fundamentals
    - Synchronize Applications Using Argo CD
    - Use Argo CD Application
    - Configure Argo CD with Helm and Kustomize
    - Identify Common Reconciliation Patterns
    content:
    - ref: ATS061
      repository: https://github.com/astrona-io/ATS061
      path: .
      version: 1.0.0
  - id: ATP012-STG003
    title: Argo Rollouts
    description: Rollout fundamentals, canary and blue-green strategies, traffic management, AnalysisTemplates and AnalysisRuns, and notifications with Argo Rollouts v1.10.
    examDomain: Argo Rollouts
    weight: 18
    learningOutcomes:
    - Understand Argo Rollouts Fundamentals
    - Use Common Progressive Rollout Strategies
    - Describe Analysis Template and AnalysisRun
    content:
    - ref: ATS062
      repository: https://github.com/astrona-io/ATS062
      path: .
      version: 1.0.0
  - id: ATP012-STG004
    title: Argo Events
    description: EventSources, Sensors, triggers, the JetStream EventBus, trigger policies, and the Argo Events 1.9 controller with its operations.
    examDomain: Argo Events
    weight: 12
    learningOutcomes:
    - Understand Argo Events Fundamentals
    - Understand Argo Event Components and Architecture
    content:
    - ref: ATS063
      repository: https://github.com/astrona-io/ATS063
      path: .
      version: 1.0.0
